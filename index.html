<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1424"><meta name="description" content="نمایش شاخص لحظه‌ای و پیش‌بینی ساعتی US AQI در تهران">
<title>WeatherGuide | شاخص کیفیت هوا</title>
<link rel="preconnect" href="https://air-quality-api.open-meteo.com">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="header">
 <div class="brand"><div class="logo">◉</div><div><b>WeatherGuide</b><small>شاخص کیفیت هوا</small></div></div>
 <label class="location-picker" for="locationSelect"><span>📍 منطقه</span><select id="locationSelect" aria-label="انتخاب منطقه تهران"><option value="tajrish">تجریش</option><option value="poonak">پونک</option><option value="rey">شهرری</option><option value="resalat">میدان رسالت</option></select></label>
 <div class="head-actions"><span id="status" class="status">در حال اتصال…</span><button id="refresh" class="refresh" title="به‌روزرسانی">⟳</button></div>
</header>
<main class="container">
 <div class="intro"><span id="place">📍 تجریش</span><span id="received"></span></div>
 <section id="currentCard" class="current-card muted">
  <div class="current-top"><span>شاخص لحظه‌ای US AQI</span><span id="updated">—</span></div>
  <div class="current-main"><strong id="currentValue">—</strong><span id="currentLabel">در حال دریافت…</span></div>
  <div class="scale"><i></i><i></i><i></i><i></i><i></i><i></i></div>
 </section>
 <section class="forecast-section">
  <div class="section-heading"><div><span class="eyebrow">چشم‌انداز کوتاه‌مدت</span><h1>پیش‌بینی شاخص</h1></div><small id="forecastNote">—</small></div>
  <div id="forecast" class="forecast"><p class="empty">در حال دریافت پیش‌بینی…</p></div>
 </section>
 <p class="note">منبع: Open-Meteo · شاخص US AQI یک شاخص برآوردی کیفیت هواست و ممکن است با اندازه‌گیری ایستگاه‌های زمینی تفاوت داشته باشد.</p>
</main>
<script src="app.js"></script>
</body></html>
